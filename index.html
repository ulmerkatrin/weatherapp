<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
    <title>Weather app</title>
</head>
<body>
    <div class="title">
        <h1>
            Weather App
        </h1>
    </div>
    <div class="card">
        <div class="search">
            <input type="search" placeholder="Enter city" required id="city-search" />
            <button id="search-button">
                <img src="src/img/search-icon.svg" alt="Search">
            </button>
        </div>
    <div class="weather-details" style="display: none;">
        <div class="city"></div>
        <div class="weather">
            <h1 class="temp"></h1>
            <h2 class="description"></h2>
        </div>
        <img class="weather-icon" src="" alt="Weather icon">
        <div class="details">
            <div class="col">
                <img src="src/img/humidity-icon.svg" alt="Humidity icon">
                <span class="humidity"></span>
                <p class="label">Humidity</p>
            </div>
            <div class="col">
                <img src="src/img/wind-icon.svg" alt="Wind icon">
                <span class="wind"></span>
                <p class="label">Wind Speed</p>
            </div>
        </div>
    </div>
    </div>
    <br>
    <br>
    <footer> 
        Brought to you by
                <a href="https://github.com/ulmerkatrin" target="_blank">Katrin Ulmer</a> and is
                <a href="https://github.com/ulmerkatrin/githubhomework" target="_blank"> on GitHub</a> and
                <a href="https://weather-currents.netlify.app/" target="_blank">hosted on Netlify</a>
    </footer>
    <script src="src/app.js"></script>
</body>
</html>
